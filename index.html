<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Паделкин — календарь</title>
<link rel="stylesheet" href="style.css">
<!-- Официальный SDK Telegram Mini Apps: Telegram.WebApp (ready, expand, позже sendData). -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Расписание</h1>
    <span class="stamp" id="stamp"></span>
    <button id="refresh">Обновить</button>
  </header>
  <main>
    <section id="s-schedule" class="screen active"></section>
    <section id="s-mine" class="screen">
      <div class="weeknav"><button id="prev">‹</button><div class="range" id="range"></div><button id="next">›</button></div>
      <div class="legend">
        <span><i style="background:var(--free)"></i>свободен</span>
        <span><i style="background:var(--rule)"></i>постоянно</span>
        <span><i style="background:var(--game)"></i>игра</span>
        <span><i style="border:2px solid var(--free-strong);width:10px;height:10px"></i>не сохранено</span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="hint">Закрашивайте пальцем, когда свободны. Снятая ячейка «постоянного» дня станет исключением на эту дату.</p>
    </section>
    <section id="s-game" class="screen">
      <div class="form">
        <label>Дата</label><div class="dates" id="gdates"></div>
        <label>Время</label>
        <div class="times"><select id="gstart"></select><span>—</span><select id="gend"></select></div>
        <label>Корт</label><input type="text" id="gcourt" placeholder="Заряд, корт 3">
        <label>Кто свободен в это время</label><div class="who" id="gwho"></div>
        <div class="actions" style="margin-top:16px"><button class="btn" id="gcreate" style="flex:1">Создать игру</button></div>
      </div>
    </section>
  </main>
  <nav class="tabs"><div class="inner">
    <button data-s="schedule" class="active"><span class="ic">📋</span>Расписание</button>
    <button data-s="mine"><span class="ic">📅</span>Моё время</button>
    <button data-s="game"><span class="ic">🎾</span>Игра</button>
  </div></nav>
  <div class="savebar" id="savebar" hidden><div class="inner"><button class="btn ghost" id="undo">Отменить</button><button class="btn" id="save">Сохранить · 0 дней</button></div></div>
  <div class="toast" id="toast"></div>
</div>
</body>
</html>
